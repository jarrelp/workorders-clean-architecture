name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WorkOrders.slnx

      - name: Build (warnings are errors)
        run: dotnet build WorkOrders.slnx --configuration Release --no-restore -warnaserror

      - name: Test with coverage
        run: >-
          dotnet test WorkOrders.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Check formatting
        run: dotnet format WorkOrders.slnx --verify-no-changes --no-restore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  container:
    name: Build and smoke-test the container image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --tag workorders-api:ci .

      - name: Start a container
        run: docker run --detach --name workorders-api --publish 8080:8080 workorders-api:ci

      - name: Check /health and create a work order
        run: |
          curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-all-errors \
            http://localhost:8080/health
          echo
          curl --silent --show-error --fail-with-body \
            --header "Content-Type: application/json" \
            --data '{"customerName":"Example Installations BV","siteDescription":"CI runner","problemDescription":"Check that the image starts and writes to its database.","hourlyRate":72.50}' \
            http://localhost:8080/work-orders
          echo

      - name: Show the container log
        if: always()
        run: docker logs workorders-api
